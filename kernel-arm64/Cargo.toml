[workspace]

[package]
name = "kernel-arm64"
version = "0.1.0"
edition = "2024"

[dependencies]
uefi = { version = "0.35", features = ["logger", "panic_handler"] }
uefi-raw = "0.11.0"
smoltcp = { version = "0.12.0", default-features = false, features = ["medium-ethernet", "proto-dhcpv4", "proto-dns", "proto-ipv4", "socket-dhcpv4", "socket-dns", "socket-icmp"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
